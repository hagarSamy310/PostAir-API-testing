$kind: http-request
url: "{{baseUrl}}/airports?airportCode=ATLj"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: countryName
    value: United States
    disabled: true
  - key: airportCode
    value: ATLj
    description: airport code
scripts:
  - type: afterResponse
    code: pm.test("Status code is 404", () => pm.response.to.have.status(404));
    language: text/javascript
settings: {}
order: 3000
