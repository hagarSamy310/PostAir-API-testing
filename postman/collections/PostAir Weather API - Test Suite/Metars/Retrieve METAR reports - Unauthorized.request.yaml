$kind: http-request
description: Returns a list of forecasts
url: "{{baseUrl}}/metars?airportCode=ATL"
method: GET
headers:
  Accept: application/json
queryParams:
  airportCode: ATL
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status code is 401", () => pm.response.to.have.status(401));
    language: text/javascript
settings: {}
order: 4000
