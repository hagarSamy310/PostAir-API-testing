$kind: http-request
description: Returns a list of METAR reports
url: "{{baseUrl}}/metars?airportCode=ATL"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: airportCode
    value: ATL
    description: airport code
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "ATL",
            "minLength": 3,
            "maxLength": 4,
            "pattern": "^[A-Z]{3,4}$"
          }
        }
      }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const data = pm.response.json();

      pm.test("Each METAR item contains expected top-level fields", () => {
          pm.expect(data.length).to.be.greaterThan(0);
          data.forEach(item => {
              pm.expect(item).to.have.property("code");
              pm.expect(item).to.have.property("name");
              pm.expect(item).to.have.property("metar");
          });

      });
    language: text/javascript
settings: {}
examples: ./.resources/Retrieve METAR report - Normal.resources/examples
order: 1000
